services:
  aionui:
    build:
      context: .
      args:
        AIONUI_VERSION: "latest"
    image: aionui:latest
    restart: unless-stopped
    ports:
      - "3000:25808"
    environment:
      AIONUI_HOST: 0.0.0.0
      AIONUI_PORT: 25808
      AIONUI_ALLOW_REMOTE: "1"
      AIONUI_OPEN_BROWSER: "0"
      AIONUI_DATA_DIR: /data
      AIONUI_LOG_DIR: /logs
    volumes:
      - ./data:/data
      - ./logs:/logs
