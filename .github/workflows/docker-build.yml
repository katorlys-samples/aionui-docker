name: Docker Build and Push

on:
  schedule:
    - cron: "30 14 * * *" # UTC 14:30 every day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-release.outputs.should_build }}
      version: ${{ steps.check-release.outputs.version }}

    steps:
      - name: Check AionUi release
        id: check-release
        run: |
          LATEST_TAG=$(curl -fsSL https://api.github.com/repos/iOfficeAI/AionUi/releases/latest | jq -r .tag_name)
          VERSION=${LATEST_TAG#v}

          if curl -fsSL "https://hub.docker.com/v2/repositories/katorlys/aionui/tags/${VERSION}/" > /dev/null; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          VERSION_TAG=${{ needs.check.outputs.version }}
          docker build --no-cache --build-arg AIONUI_VERSION=$VERSION_TAG -t katorlys/aionui:$VERSION_TAG -t katorlys/aionui:latest .
          docker push katorlys/aionui:$VERSION_TAG
          docker push katorlys/aionui:latest